<!doctype html>
<html lang="en">
<head>

<title>How Vector Databases Work — 3D Showreel</title>
<meta name="description" content="A Three.js motion-graphics showreel: unstructured data becomes 3D vector embeddings, then similarity search.">
<style>

  #chap{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#8fb4d8;opacity:.85;transition:opacity .6s;pointer-events:none}
  #chap b{color:var(--accent);font-weight:600;margin-right:.8em}
  #hud{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:999px;
    background:rgba(12,18,34,.45);border:1px solid rgba(160,200,255,.16);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    box-shadow:0 8px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);transition:opacity .6s,transform .6s;z-index:4}
  #hud.idle{opacity:0;transform:translate(-50%,14px)}
  #hud button{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--ink);font-size:13px}
  #hud button:hover,#hud button:focus-visible{background:rgba(94,231,255,.18)}
  #bar{position:relative;flex:1;height:22px;cursor:pointer;display:flex;align-items:center}
  #bar::before{content:"";position:absolute;left:0;right:0;height:3px;border-radius:3px;background:rgba(160,200,255,.18)}
  #fill{position:absolute;left:0;height:3px;border-radius:3px;background:linear-gradient(90deg,#5ee7ff,#a78bfa,#ff5fa2);box-shadow:0 0 12px rgba(94,231,255,.7);width:0}
  .tick{position:absolute;top:50%;width:2px;height:9px;margin-top:-4.5px;background:rgba(220,235,255,.35);border-radius:1px}
  #time{font:12px ui-monospace,Menlo,Consolas,monospace;color:#9db8d6;min-width:84px;text-align:right}
  @media (max-width:520px){#time{display:none}}

<body>
<canvas id="c"></canvas>
<div id="chap"></div>
<div id="hud" role="group" aria-label="Playback">
  <button id="play" aria-label="Play or pause">❚❚</button>
  <div id="bar" role="slider" aria-label="Timeline" tabindex="0"><div id="fill"></div></div>

</div>
<div id="loader">BUILDING VECTOR SPACE…</div>

<script type="module">
import * as THREE from 'three';

THREE.ColorManagement.enabled = false;           // all colours are authored display-referred
const V3 = THREE.Vector3;
const DURATION = 87;

/* ───────────────────────── helpers ───────────────────────── */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const win=(t,a,b,fi=.8,fo=.7)=>sstep(a,a+fi,t)*(1-sstep(b-fo,b,t));
const mulberry=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=mulberry(11);
const gauss=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const FONT='Inter,"SF Pro Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif';
const MONO='ui-monospace,"SF Mono",Menlo,Consolas,monospace';
const fmtTime=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

/* ───────────────────────── renderer ───────────────────────── */
const canvas=document.getElementById('c');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
  if(!renderer.capabilities.isWebGL2) throw new Error('webgl2');
}catch(e){ document.getElementById('err').style.display='grid'; document.getElementById('loader').remove(); throw e; }
renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
renderer.autoClear=false;
renderer.setClearColor(0x000000,1);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,.05,700);

/* shared uniforms */
const U={
  uTime:{value:0}, uScale:{value:1000}, uSearch:{value:0}, uFogCol:{value:new THREE.Color(.012,.018,.045)},
  tBlur:{value:null}, uRes:{value:new THREE.Vector2(1,1)}
};

/* ───────────────────────── story data ───────────────────────── */
const GATE=new V3(0,0,40);
const CLUSTERS=[
 {name:'ANIMALS',c:new V3(-10,2,6),  col:new THREE.Color('#ff5fa2'),words:'kitten cat tabby puppy hamster lion tiger wolf fox horse rabbit parrot dolphin panda otter eagle zebra koala gecko bison moose lynx seal whale owl deer'.split(' ')},
 {name:'FOOD',   c:new V3(9,-3,8),   col:new THREE.Color('#ffb347'),words:'pizza pasta sushi ramen taco burger curry salad bagel waffle risotto falafel dumpling paella brownie croissant noodles steak omelet pancake kebab gelato tamale pho biryani soup'.split(' ')},
 {name:'SPACE',  c:new V3(2,9,-8),   col:new THREE.Color('#4da3ff'),words:'galaxy orbit nebula comet quasar pulsar asteroid eclipse cosmos rocket saturn meteor supernova telescope gravity lunar exoplanet stardust apollo mars aurora void photon equinox satellite jupiter'.split(' ')},
 {name:'MUSIC',  c:new V3(-6,-7,-10),col:new THREE.Color('#3ee6c1'),words:'guitar jazz melody piano chorus drums violin tempo opera vinyl synth rhythm concert ballad bass harmony cello reggae lyrics remix tenor flute riff encore techno blues'.split(' ')},
 {name:'CODE',   c:new V3(11,5,-14), col:new THREE.Color('#b36bff'),words:'python function compile rust array debug kernel lambda parser docker regex commit linter socket binary runtime thread query schema module async stack cache branch syntax api'.split(' ')},
];
const PER=26;
const QPOS=CLUSTERS[0].c.clone().add(new V3(2.2,.6,2.0));
const NB=[
 {name:'kitten_nap.jpg',          type:'IMG',d:.55},
 {name:'Why cats sleep so much',  type:'TXT',d:.90},
 {name:'purring_loop.wav',        type:'AUD',d:1.15},
 {name:'puppy_asleep.jpg',        type:'IMG',d:1.70},
 {name:'Caring for newborn kittens',type:'TXT',d:2.00},
];
NB.forEach(n=>n.score=1-n.d*.035);

const pts=[]; // {ci,p,word,rank,size}
NB.forEach((n,i)=>{
  let p;
  for(let k=0;k<300;k++){
    const v=new V3(gauss(),gauss(),gauss()).normalize(); v.z=-Math.abs(v.z)*.8; v.normalize();
    p=QPOS.clone().addScaledVector(v,n.d);
    if(pts.every(o=>o.p.distanceTo(p)>.85)) break;
  }
  pts.push({ci:0,p,word:n.name,rank:i,size:.34});
});
CLUSTERS.forEach((cl,ci)=>{
  let wi=0;
  while(pts.filter(o=>o.ci===ci).length<PER){
    const p=cl.c.clone().add(new V3(gauss(),gauss()*.9,gauss()).multiplyScalar(2.1));
    if(ci===0 && p.distanceTo(QPOS)<2.8) continue;
    if(pts.some(o=>o.p.distanceTo(p)<.95)) continue;
    pts.push({ci,p,word:cl.words[wi++%cl.words.length],rank:-1,size:.24+R()*.1});
  }
});
const N=pts.length;
pts.forEach(o=>{o.type=Math.floor(R()*3);o.delay=R();});

/* ───────────────────────── camera path ───────────────────────── */
const KF=[
 [0,  [0,4,92],   [0,1,60]],
 [5,  [-3,3,82],  [0,0,60]],
 [9,  [9,2,70],   [0,0,60]],
 [13, [-7,-1,66], [0,0,58]],
 [17, [-4,1,56],  [0,0,45]],
 [21, [2,1,48],   [0,0,38]],
 [22.5,[1.2,-.4,41],[0,0,30]],
 [25, [.8,.6,33],  [0,0,12]],
 [27.5,[.8,1,27],  [0,0,6]],
 [31, [2,4,24],   [0,0,0]],
 [34, [13,5,20],  [2,0,2]],
 [39, [3,-1,10],  [-8,2,6]],
 [43, [-3,3,13],  [-10,2,6]],
 [47, [-5,4,17],  [-9,2.5,8]],
 [52, [-4.5,3.6,15.5],[-8,2.6,8]],
 [57, [-7.5,3.5,12.5],[-8,2.6,8]],
 [61, [-13,5,15.5],[-8,2.6,8]],
 [65, [-12.5,2,11],[-8,2.6,8]],
 [69, [-4,10,26], [0,0,-4]],
 [73, [14,12,22], [0,0,-2]],
 [77, [16,6,10],  [-2,2,-2]],
 [80, [22,18,40], [0,0,-2]],
 [87, [0,14,70],  [0,0,-5]],
];
const posCurve=new THREE.CatmullRomCurve3(KF.map(k=>new V3(...k[1])),false,'centripetal');
const lookCurve=new THREE.CatmullRomCurve3(KF.map(k=>new V3(...k[2])),false,'centripetal');
const kt=KF.map(k=>k[0]);
function uLin(t){
  t=clamp(t,kt[0],kt[kt.length-1]); let i=0; while(i<kt.length-2&&t>kt[i+1]) i++;
  return (i+(t-kt[i])/(kt[i+1]-kt[i]))/(kt.length-1);
}
function uAt(t){ // low-passed so the camera never changes speed abruptly
  const o=[-1.4,-.7,0,.7,1.4], w=[1,2,3,2,1]; let s=0,ws=0;
  o.forEach((d,i)=>{s+=uLin(t+d)*w[i];ws+=w[i]}); return s/ws;
}
const _p=new V3(),_l=new V3();
function camAt(t){
  const u=uAt(t); posCurve.getPoint(u,_p); lookCurve.getPoint(u,_l);
  const sway=.1*clamp(Math.min(t,3)/3);
  _p.add(new V3(Math.sin(t*.7)*sway,Math.sin(t*.9+1)*sway,Math.sin(t*.53+2)*sway));
  return {pos:_p.clone(),look:_l.clone()};
}
const fovAt=t=>48+14*win(t,22.5,31,2,3)+5*win(t,66,80,3,3);

/* ───────────────────────── background dome ───────────────────────── */
const noiseGLSL=`
float h31(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vnoise(p);p*=2.03;a*=.5;}return s;}`;
const dome=new THREE.Mesh(new THREE.SphereGeometry(400,48,24),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,depthTest:false,
  uniforms:{uTime:U.uTime,uWarm:{value:0}},
  vertexShader:`varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*viewMatrix*vec4(position+cameraPosition,1.);}`,
  fragmentShader:`varying vec3 vD;uniform float uTime,uWarm;${noiseGLSL}
   void main(){vec3 d=normalize(vD);
    vec3 base=mix(vec3(.004,.006,.014),vec3(.014,.02,.05),smoothstep(-.6,1.,d.y));
    float n=fbm(d*2.6+vec3(0.,uTime*.004,0.));
    float n2=fbm(d*5.+7.);
    vec3 neb=mix(vec3(.05,.1,.28),vec3(.22,.06,.3),n2)*pow(n,2.6)*1.1;
    base+=neb*(.55+.45*uWarm);
    gl_FragColor=vec4(base,1.);}`
}));
dome.renderOrder=-100; dome.frustumCulled=false; scene.add(dome);

/* ───────────────────────── dust / lattice (GPU points) ───────────────────────── */
function dustMaterial(o={}){
  return new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uTime:U.uTime,uScale:U.uScale,uReveal:{value:o.reveal??1},uAlpha:{value:o.alpha??1},uFlow:{value:o.flow??.5},uMax:{value:o.max??14}},
    vertexShader:`
     attribute vec3 aCol;attribute vec2 aSeed;
     uniform float uTime,uScale,uReveal,uAlpha,uFlow,uMax;
     varying vec3 vCol;varying float vA;
     void main(){
      vec3 p=position;float ph=aSeed.y;
      p+=uFlow*vec3(sin(uTime*.23+ph*30.+p.y*.2),cos(uTime*.19+ph*20.+p.z*.2),sin(uTime*.21+ph*25.+p.x*.2));
      vec4 mv=viewMatrix*vec4(p,1.);float d=length(mv.xyz);
      gl_Position=projectionMatrix*mv;
      gl_PointSize=clamp(aSeed.x*uScale/max(d,.1),1.5,uMax);
      float tw=.65+.35*sin(uTime*(1.+ph*3.)+ph*50.);
      vA=uAlpha*tw*smoothstep(.3,2.6,d)*smoothstep(ph,ph+.1,uReveal)*(1.-smoothstep(70.,140.,d));
      vCol=aCol;}`,
    fragmentShader:`varying vec3 vCol;varying float vA;
     void main(){float r=length(gl_PointCoord-.5)*2.;float a=exp(-r*r*4.5)*(1.-smoothstep(.85,1.,r));
      gl_FragColor=vec4(vCol*1.6,a*vA);}`
  });
}
function dustPoints(n,gen,mat){
  const pos=new Float32Array(n*3),col=new Float32Array(n*3),seed=new Float32Array(n*2),o={p:new V3(),c:new THREE.Color(),s:.1};
  for(let i=0;i<n;i++){gen(i,o);pos.set([o.p.x,o.p.y,o.p.z],i*3);col.set([o.c.r,o.c.g,o.c.b],i*3);seed.set([o.s,R()],i*2);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aCol',new THREE.BufferAttribute(col,3));
  g.setAttribute('aSeed',new THREE.BufferAttribute(seed,2));
  const m=new THREE.Points(g,mat); m.frustumCulled=false; scene.add(m); return m;
}
// ambient depth dust everywhere
const matBG=dustMaterial({alpha:.55,flow:.8});
dustPoints(11000,(i,o)=>{o.p.set((R()-.5)*130,(R()-.5)*70,-45+R()*160);const k=R();o.c.setRGB(.25+.2*k,.4+.2*k,.8);o.s=.12+R()*.2;},matBG);
// chaos dust around the raw data
const matChaos=dustMaterial({alpha:.9,flow:1.2});
dustPoints(3500,(i,o)=>{o.p.set(gauss()*9,gauss()*5.5,60+gauss()*7);const k=R();o.c.setRGB(.3+.5*k,.5,.9-.4*k);o.s=.09+R()*.12;},matChaos);
// cluster haloes
const haloMats=[];
CLUSTERS.forEach(cl=>{
  const m=dustMaterial({alpha:.8,flow:.35,reveal:0});haloMats.push(m);
  dustPoints(3200,(i,o)=>{o.p.copy(cl.c).add(new V3(gauss(),gauss()*.9,gauss()).multiplyScalar(3.1));
    const k=R();o.c.copy(cl.col).multiplyScalar(.6+.5*k);o.s=.06+R()*.12;},m);
});
// 3D lattice (parallax cue while flying)
const matLat=dustMaterial({alpha:.55,flow:0,reveal:0,max:6});
{
  const arr=[];for(let x=-24;x<=24;x+=4)for(let y=-12;y<=16;y+=4)for(let z=-28;z<=24;z+=4)arr.push([x,y,z]);
  dustPoints(arr.length,(i,o)=>{o.p.set(...arr[i]);o.c.setRGB(.35,.8,1);o.s=.07;o.p.x+=0;},matLat);
}

/* ───────────────────────── infinite-feel grid walls + axes ───────────────────────── */
function gridMaterial(ua,ub,center){
  return new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
    uniforms:{uA:{value:ua},uB:{value:ub},uC:{value:center},uAlpha:{value:0},uCol:{value:new THREE.Color(.25,.75,1)}},
    vertexShader:`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader:`varying vec3 vW;uniform vec3 uA,uB;uniform vec2 uC;uniform float uAlpha;uniform vec3 uCol;
     float gl(vec2 g){vec2 w=fwidth(g)*1.2;vec2 a=abs(fract(g-.5)-.5)/w;return 1.-min(min(a.x,a.y),1.);}
     void main(){vec2 p=vec2(dot(vW,uA),dot(vW,uB));
      float l1=gl(p/4.),l2=gl(p/20.);
      float d=length(p-uC);float fade=1.-smoothstep(14.,46.,d);
      float cd=length(vW-cameraPosition);fade*=smoothstep(1.,6.,cd);
      float a=(l1*.16+l2*.5)*fade*uAlpha;
      gl_FragColor=vec4(uCol*a*1.8,a);}`
  });
}
const gridFloor=new THREE.Mesh(new THREE.PlaneGeometry(160,160),gridMaterial(new V3(1,0,0),new V3(0,0,1),new THREE.Vector2(0,0)));
gridFloor.rotation.x=-Math.PI/2;gridFloor.position.y=-13;
const gridBack=new THREE.Mesh(new THREE.PlaneGeometry(160,100),gridMaterial(new V3(1,0,0),new V3(0,1,0),new THREE.Vector2(0,0)));
gridBack.position.z=-28;
const gridSide=new THREE.Mesh(new THREE.PlaneGeometry(160,100),gridMaterial(new V3(0,0,1),new V3(0,1,0),new THREE.Vector2(0,0)));
gridSide.rotation.y=Math.PI/2;gridSide.position.x=-26;
[gridFloor,gridBack,gridSide].forEach(m=>{m.frustumCulled=false;scene.add(m)});
const axes=new THREE.Group();
{
  const o=new V3(-26,-13,-28);
  [[new V3(52,0,0),new THREE.Color(1.2,.35,.6)],[new V3(0,32,0),new THREE.Color(.4,1,.7)],[new V3(0,0,56),new THREE.Color(.4,.6,1.2)]].forEach(([d,c])=>{
    const g=new THREE.BufferGeometry().setFromPoints([o,o.clone().add(d)]);
    axes.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false})));
  });
  scene.add(axes);
}

/* ───────────────────────── sprites / labels ───────────────────────── */
function glowTexture(inner='rgba(255,255,255,1)',mid='rgba(120,220,255,.35)'){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,inner);g.addColorStop(.25,mid);g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(c);return t;
}
function ringTexture(){
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  const g=x.createRadialGradient(128,128,70,128,128,126);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.82,'rgba(160,240,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function labelSprite(text,{color='#9fe8ff',size=40,pill=true,weight=600,spacing=0,sub=null}={}){
  const S=2,c=document.createElement('canvas'),x=c.getContext('2d');
  x.font=`${weight} ${size}px ${FONT}`;
  let tw=0;for(const ch of text)tw+=x.measureText(ch).width+spacing;
  let sw=0;if(sub){x.font=`500 ${size*.7}px ${MONO}`;sw=x.measureText(sub).width;x.font=`${weight} ${size}px ${FONT}`;}
  const pad=pill?size*.55:size*.4, w=Math.ceil(Math.max(tw,sw)+pad*2), h=Math.ceil(size*(sub?2.25:1.6)+ (pill?size*.2:0));
  c.width=w*S;c.height=h*S;x.scale(S,S);
  if(pill){rr(x,2,2,w-4,h-4,(h-4)/2.2);x.fillStyle='rgba(6,10,22,.74)';x.fill();x.lineWidth=2;x.strokeStyle=color;x.globalAlpha=.9;x.stroke();x.globalAlpha=1;}
  x.font=`${weight} ${size}px ${FONT}`;x.textBaseline='middle';x.textAlign='left';
  x.shadowColor=color;x.shadowBlur=pill?8:22;x.fillStyle='#fff';
  let px=(w-tw)/2, py=sub?h*.38:h/2+1;for(const ch of text){x.fillText(ch,px,py);px+=x.measureText(ch).width+spacing;}
  if(sub){x.shadowBlur=0;x.font=`500 ${size*.7}px ${MONO}`;x.fillStyle=color;x.textAlign='center';x.fillText(sub,w/2,h*.74);}
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));
  sp.renderOrder=20;sp.userData.aspect=w/h;sp.frustumCulled=false;scene.add(sp);return sp;
}
const labels=[];
function addLabel(sp,pos,o){labels.push(Object.assign({sp,pos,h:.04,vis:()=>1},o));}
// per-frame: constant screen-size labels, faded when too close or far
function updateLabels(t){
  const tanH=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  labels.forEach(L=>{
    const d=camera.position.distanceTo(L.pos);
    const a=L.vis(t)*smoothClose(d,L.near??3,L.near??3+3)*(1-sstep(L.far??52,(L.far??52)+16,d));
    L.sp.material.opacity=a;L.sp.visible=a>.01;
    if(!L.sp.visible)return;
    const hWorld=L.h*2*d*tanH;
    L.sp.scale.set(hWorld*L.sp.userData.aspect,hWorld,1);
    L.sp.position.copy(L.pos);
  });
}

  U.uTime.value=t;
  // camera
  const c=camAt(t);camera.position.copy(c.pos);
  camera.fov=fovAt(t)+(camera.aspect<1?22*(1-camera.aspect):0);camera.updateProjectionMatrix();
  const roll=.035*Math.sin(t*.31)+.1*win(t,23,29.5,1.5,1.5)-.05*win(t,33,38,1.5,1.5);
  camera.up.set(Math.sin(roll),Math.cos(roll),0);camera.lookAt(c.look);
  U.uScale.value=Hpx/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
  // world reveal
  const wr=sstep(24,29,t);
  gridFloor.material.uniforms.uAlpha.value=wr;gridBack.material.uniforms.uAlpha.value=wr*.8;gridSide.material.uniforms.uAlpha.value=wr*.8;
  axes.children.forEach(l=>l.material.opacity=.7*wr);
  matLat.uniforms.uReveal.value=sstep(24,34,t)*1.1;matLat.uniforms.uAlpha.value=.6*wr;
  matChaos.uniforms.uAlpha.value=.9*(1-sstep(19,28,t));
  const haloR=sstep(21,32,t)*1.15;haloMats.forEach(m=>m.uniforms.uReveal.value=haloR);
  dome.material.uniforms.uWarm.value=wr;
  U.uSearch.value=sstep(56.8,59.5,t)*(1-.55*sstep(68,71,t));
  // embedding gate
  const en=(.22*sstep(8,13,t)+sstep(15.5,18,t)*(1-sstep(27,31,t)))*(.8+.2*Math.sin(t*5));
  const gv=1-sstep(36,40,t);
  gate.visible=gv>.01;gateMats.lines.opacity=.3*en*gv;gateMats.nodes.uniforms.uEnergy.value=en*gv;
  gateMats.tori.forEach((m,i)=>m.opacity=(.35+.6*en)*gv*(i===2?.5:1));gateMats.core.material.opacity=.3*en*sstep(16,19,t)*(1-sstep(25,29,t))*gv;
  gate.rotation.z=t*.05;
  // query
  const qv=t>TQ.start;queryGroup.visible=qv&&t<86.5;
  if(qv){
    const f=clamp((t-TQ.start)/(TQ.land-TQ.start)),e=f*f*(3-2*f);
    const cp=camAt(TQ.start),fw=cp.look.clone().sub(cp.pos).normalize(),rt_=fw.clone().cross(new V3(0,1,0)).normalize(),up=rt_.clone().cross(fw);
    const s0=cp.pos.clone().addScaledVector(fw,5).addScaledVector(rt_,-2.2).addScaledVector(up,1.4);
    const mid=s0.clone().lerp(QPOS,.5).add(new V3(0,2.5,0));
    _a.copy(s0).lerp(mid,e);_b.copy(mid).lerp(QPOS,e);queryGroup.position.copy(_a.lerp(_b,e));
    const sc=sstep(0,.15,f)*(1+.25*Math.sin(t*3)*sstep(.9,1,f));
    qCore.scale.setScalar(sc);qHalo.scale.setScalar(2.4*sc*(1+.12*Math.sin(t*4)));
    qRing.forEach((r,i)=>{const ph=((t*.6+i*.5)%1);r.scale.setScalar((.6+ph*4.2)*sstep(.9,1,f));r.material.opacity=(1-ph)*.9*sstep(.9,1,f);});
    qHalo.material.opacity=.9*(1-sstep(74,79,t)*.7);
  }
  // search shell + beams
  const sh=sstep(56.6,60.2,t),shFade=1-sstep(67,69.5,t);
  shell.visible=sh>0&&shFade>0.01;shell.scale.setScalar(.15+(NB[4].d+.6)*sh*(1+.02*Math.sin(t*3)));shellMat.uniforms.uAlpha.value=.5*sh*shFade;
  beams.forEach((b,i)=>{b.m.uniforms.uGrow.value=sstep(60+i*.4,61.3+i*.4,t)*1.02;b.m.uniforms.uAlpha.value=1-sstep(67.5,69.5,t);b.mesh.visible=t>59.9&&t<70;});
  // ANN graph
  graphMat.uniforms.uGraph.value=sstep(67.5,73,t)*1.1;graphMat.uniforms.uAlpha.value=1-.55*sstep(78.5,82,t);
  const pg=sstep(71,76.2,t);pathMat.uniforms.uGrow.value=pg*1.001;pathMat.uniforms.uAlpha.value=1-.5*sstep(80,84,t);pathMesh.visible=t>70.9;
  traveler.visible=pg>0&&t<82;if(traveler.visible){pathCurve.getPointAt(clamp(pg,0,.9999),_a);traveler.position.copy(_a);traveler.scale.setScalar(1.6+.3*Math.sin(t*9));}
  updateLabels(t);
  panes.forEach(p=>p.update(t));
  // HUD
  let ch=chapters[0];chapters.forEach(k=>{if(t>=k[0])ch=k;});
  if(chapEl.dataset.k!==ch[1]){chapEl.dataset.k=ch[1];chapEl.innerHTML=`<b>${String(chapters.indexOf(ch)).padStart(2,'0')}</b>${ch[1]}`;}
}

/* ───────────────────────── frame loop, controls, adaptive quality ───────────────────────── */
const chapEl=document.getElementById('chap');
const fillEl=document.getElementById('fill'),timeEl=document.getElementById('time'),playBtn=document.getElementById('play'),bar=document.getElementById('bar'),hud=document.getElementById('hud');
chapters.slice(1).forEach(k=>{const d=document.createElement('i');d.className='tick';d.style.left=(k[0]/DURATION*100)+'%';bar.appendChild(d);});
const qs=new URLSearchParams(location.search);
let t=parseFloat(qs.get('t')||'0')||0,playing=!qs.has('pause'),last=performance.now(),idleTimer,slow=0,frames=0,acc=0;
function render(){
  update(t);
  renderer.setRenderTarget(rt.scene);renderer.clear();renderer.render(scene,camera);
  const fade=sstep(0,1.2,t)*(1-sstep(DURATION-1.4,DURATION,t));
  postAndPanes(fade);
  fillEl.style.width=(t/DURATION*100)+'%';timeEl.textContent=`${fmtTime(t)} / ${fmtTime(DURATION)}`;
}
function setPlaying(p){playing=p;playBtn.textContent=p?'❚❚':'▶';}
function seek(s){t=clamp(s,0,DURATION);panes.forEach(p=>p.lastDraw=-1);if(!playing)render();}
function wake(){hud.classList.remove('idle');chapEl.style.opacity=.85;clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(playing){hud.classList.add('idle');chapEl.style.opacity=.45;}},2800);}
playBtn.onclick=()=>{if(t>=DURATION-.01){seek(0);}setPlaying(!playing);wake();};
bar.addEventListener('pointerdown',e=>{const go=ev=>{const r=bar.getBoundingClientRect();seek((ev.clientX-r.left)/r.width*DURATION);};go(e);bar.setPointerCapture(e.pointerId);const mv=ev=>go(ev);bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',()=>bar.removeEventListener('pointermove',mv),{once:true});});
document.getElementById('full').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();};
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playBtn.click();}
  else if(e.code==='ArrowRight')seek(t+5);else if(e.code==='ArrowLeft')seek(t-5);
  else if(e.key==='r'||e.key==='R'){seek(0);setPlaying(true);}
  else if(e.key==='f'||e.key==='F')document.getElementById('full').click();
  wake();
});
addEventListener('pointermove',wake);addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{last=performance.now();});
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){t+=dt;if(t>=DURATION){t=DURATION;setPlaying(false);hud.classList.remove('idle');}}
  render();
  // adaptive resolution: drop pixel ratio if the GPU can't keep up
  acc+=dt;frames++;
  if(acc>2){const fps=frames/acc;acc=0;frames=0;
    if(fps<28&&pr>.7){pr=Math.max(.7,pr*.8);resize();}}
}
function boot(){
  resize();
  update(t);
  // compile everything up-front so the first seconds don't hitch
  renderer.compile(scene,camera);
  render();
  document.getElementById('loader').classList.add('done');
  setPlaying(playing);wake();
  window.__seek=s=>{t=s;panes.forEach(p=>p.lastDraw=-1);render();};
  window.__ready=true;
  if(qs.has('capture')){document.getElementById('hud').style.display='none';chapEl.style.display='none';}
  else requestAnimationFrame(n=>{last=n;frame(n);});
}
let pr=qs.has('capture')?1:Math.min(devicePixelRatio||1,2);
boot();
</script>
